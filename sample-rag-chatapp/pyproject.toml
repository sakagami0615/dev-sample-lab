[project]
name = "sample-rag-chatapp"
version = "0.1.0"
description = "StreamlitとLangChainで構築するRAGチャットアプリのサンプル"
authors = [{name = "skip"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "streamlit (>=1.60.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-openai (>=1.4.0,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "ddgs (>=9.14.4,<10.0.0)",
    "wikipedia (>=1.4.0,<2.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "tiktoken (>=0.11.0,<1.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
